<style>
/* ===== Variabel warna & animasi (ubah di sini) ===== */
:root{--cream:#FAF8F4;--sand:#F3EEE4;--sage:#899681;--sage-d:#5F6E58;--sage-dd:#3F4A39;--gold:#C5A46D;--gold-d:#A8864F;--gold2:#E6D3AB;--ink:#302923;--mut:#8A7F73;--line:#E7DFCF;--d:.9s;--ease:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font:300 15px/1.75 Poppins,system-ui,sans-serif;color:var(--ink);background:#E9E4D8;-webkit-text-size-adjust:100%}
body.locked{overflow:hidden}
img{display:block;max-width:100%}
button{font-family:inherit}
.wrap{max-width:430px;margin:0 auto;background:var(--cream);overflow-x:hidden;box-shadow:0 0 50px rgba(48,41,35,.10)}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;line-height:1.12}
h2{font-size:2.1rem;margin-bottom:12px;letter-spacing:.01em}
h3{font-size:1.5rem}
.sm{font-size:.84rem;opacity:.85}
.ar{font-family:Amiri,'Traditional Arabic','Scheherazade New',serif;direction:rtl;line-height:2.1}
.sec{padding:84px 30px;text-align:center;position:relative;overflow:hidden;background:var(--cream)}
.wrap>section:last-of-type{padding-bottom:128px}
.sand{background:var(--sand)}
.sage{background:var(--sage-dd);color:#fff}
.eye{font-size:.68rem;letter-spacing:.34em;text-transform:uppercase;color:var(--gold-d);font-weight:500;margin-bottom:10px}
.sage .eye,.cover .eye{color:var(--gold2)}
.ln{display:block;height:1px;width:44px;margin:16px auto 28px;background:var(--gold)}
.js [data-anim=line]{opacity:1;width:0;transition:width 1.1s var(--ease) .15s}
.js [data-anim=line].is-visible{width:44px}
.no-anim [data-anim=line]{width:44px!important}
.orn{display:flex;align-items:center;justify-content:center;gap:12px;color:var(--gold);margin:4px auto 20px}
.orn:before,.orn:after{content:"";height:1px;width:40px;background:linear-gradient(90deg,transparent,currentColor)}
.orn:after{transform:scaleX(-1)}
.orn svg{width:18px;height:18px;fill:currentColor}

/* tombol */
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:10px 28px;border:0;border-radius:999px;background:var(--gold);color:var(--ink);font:500 .82rem Poppins,sans-serif;letter-spacing:.05em;cursor:pointer;text-decoration:none;transition:transform .25s var(--ease),box-shadow .25s,background .25s;box-shadow:0 10px 22px -12px rgba(168,134,79,.95)}
.btn:after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);transition:left .7s var(--ease)}
.btn:hover:after{left:130%}
.btn:hover{background:#CFB07A;transform:translateY(-1px)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--sage-d);border:1px solid var(--gold);box-shadow:none}
.sage .btn.ghost,.cover .btn.ghost{color:#fff;border-color:rgba(255,255,255,.6)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.dock button:focus-visible{outline:2px solid var(--sage);outline-offset:2px}

/* ===== Cover ===== */
.cover{position:relative;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;justify-content:center;overflow:hidden;background:var(--sage-dd);color:#fff}
.slides,.slides img,.veil,.parts{position:absolute;inset:0}
.slides{will-change:transform;inset:-70px 0 0 0}
.slides img{width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1);transition:opacity 1.6s,transform 9s linear;filter:saturate(.85)}
.slides img.on{opacity:1;transform:scale(1.07)}
.veil{background:linear-gradient(to bottom,rgba(33,40,30,.62) 0%,rgba(33,40,30,.50) 45%,rgba(28,35,26,.92) 100%)}
.parts{pointer-events:none;overflow:hidden;z-index:1}
.parts i{position:absolute;bottom:-10px;border-radius:50%;background:rgba(230,211,171,.7);animation:up linear infinite}
@keyframes up{to{transform:translateY(-110vh);opacity:0}}
.cover-body{position:relative;z-index:2;padding:56px 28px 48px;text-align:center}
.bismillah{font-size:1.6rem;color:var(--gold2);margin-bottom:2px}
.cover .judul{font-size:.66rem;letter-spacing:.38em;margin:6px 0 26px;font-weight:400;opacity:.92}
.arch{width:150px;height:196px;margin:0 auto 24px;border-radius:75px 75px 12px 12px;padding:5px;border:1px solid rgba(230,211,171,.75);position:relative}
.arch:after{content:"";position:absolute;inset:-9px;border-radius:84px 84px 18px 18px;border:1px solid rgba(230,211,171,.28);pointer-events:none}
.arch-in{width:100%;height:100%;border-radius:70px 70px 8px 8px;overflow:hidden;background:var(--sand)}
.arch-in img{width:100%;height:100%;object-fit:cover}
.cover h1{font-size:3rem;font-weight:500;margin:2px 0 8px;letter-spacing:.01em}
.cover .tgl{font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;opacity:.9}
.guest{margin:30px auto 24px;font-size:.74rem;letter-spacing:.06em;max-width:280px;padding:14px 18px;border-radius:18px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.guest b{display:block;font:500 1.4rem 'Cormorant Garamond',Georgia,serif;margin-top:2px;color:var(--gold2);overflow-wrap:anywhere;letter-spacing:.01em}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
#buka{animation:ring 2.6s ease-out infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(230,211,171,.55)}70%,100%{box-shadow:0 0 0 16px rgba(230,211,171,0)}}
.scrollcue{display:none}

/* ===== Pembukaan & profil ===== */
.salam{font:500 1.45rem/1.3 'Cormorant Garamond',Georgia,serif;margin-bottom:10px}
.pb{max-width:330px;margin:0 auto}
.pb p{font-size:.88rem;margin-bottom:12px}
.arch.lg{width:200px;height:260px;border-radius:100px 100px 16px 16px;margin:6px auto 30px;border-color:var(--gold);box-shadow:0 24px 40px -26px rgba(48,41,35,.5)}
.arch.lg:after{inset:-10px;border-radius:110px 110px 24px 24px;border-color:rgba(197,164,109,.35)}
.arch.lg .arch-in{border-radius:95px 95px 11px 11px}
.prof h3{font-size:2.3rem;margin-bottom:2px}
.prof .pg{font:italic 400 1.15rem 'Cormorant Garamond',Georgia,serif;color:var(--gold-d);margin-bottom:18px}
.ortu{max-width:260px;margin:14px auto 0;padding:18px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.ortu small{display:block;font-size:.66rem;letter-spacing:.28em;text-transform:uppercase;color:var(--mut);margin-bottom:6px}
.ortu b{font:500 1.25rem 'Cormorant Garamond',Georgia,serif}

/* ===== Doa ===== */
.doa .ar{font-size:1.7rem;color:var(--gold2);margin:8px 0 18px}
.doa blockquote{font-size:.88rem;font-style:italic;max-width:330px;margin:0 auto 8px;opacity:.95}
.doa cite{display:block;font-size:.72rem;letter-spacing:.14em;color:var(--gold2);margin-bottom:20px;font-style:normal}
.doa .hp{font-size:.86rem;max-width:320px;margin:0 auto;opacity:.85}

/* ===== Hitung mundur ===== */
.cd{display:grid;grid-template-columns:repeat(4,1fr);margin:0 auto 34px;max-width:320px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.cd div{padding:16px 2px 12px;border-right:1px solid var(--line)}
.cd div:last-child{border-right:0}
.cd b{display:block;font:500 2.1rem/1 'Cormorant Garamond',Georgia,serif;color:var(--sage-d);font-variant-numeric:tabular-nums}
.cd b.tk{animation:tk .5s var(--ease)}
@keyframes tk{from{opacity:.2;transform:translateY(-8px)}to{opacity:1;transform:none}}
.cd small{font-size:.62rem;letter-spacing:.22em;text-transform:uppercase;color:var(--mut)}

/* ===== Kartu acara ===== */
.ev{display:grid;grid-template-columns:96px 1fr;max-width:340px;margin:0 auto 18px;background:#fff;border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 22px 40px -28px rgba(48,41,35,.45);text-align:left;transition:transform .4s var(--ease),box-shadow .4s}
.ev:hover{transform:translateY(-3px);box-shadow:0 28px 44px -26px rgba(48,41,35,.5)}
.ev-d{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:22px 6px;text-align:center;border-right:1px solid var(--line);background:var(--sand)}
.ev-d small{font-size:.6rem;letter-spacing:.2em;color:var(--mut)}
.ev-d b{font:500 3rem/1 'Cormorant Garamond',Georgia,serif;color:var(--sage-d)}
.ev-d span{font-size:.74rem;letter-spacing:.22em;color:var(--gold-d);font-weight:500}
.ev-i{padding:22px 20px}
.ev-i h3{font-size:1.6rem;margin-bottom:8px}
.ev-i .t{display:inline-block;font-size:.72rem;letter-spacing:.04em;padding:3px 12px;border-radius:999px;border:1px solid var(--line);color:var(--sage-d);margin-bottom:12px}
.ev-i p{font-size:.84rem;line-height:1.6;margin-bottom:16px;overflow-wrap:anywhere}
.ev-i .btn{min-height:40px;padding:8px 20px}

/* ===== Kartu hadiah ===== */
.glass{background:#fff;border:1px solid var(--line);border-radius:24px;padding:34px 22px;color:var(--ink);box-shadow:0 22px 40px -30px rgba(48,41,35,.45)}
.glass p{margin-bottom:18px;font-size:.86rem}

/* ===== Galeri ===== */
.gal{columns:2;column-gap:10px}
.gal img{width:100%;margin-bottom:10px;border-radius:14px;cursor:pointer;break-inside:avoid;object-fit:cover;transition:transform .5s var(--ease),filter .4s;filter:saturate(.9)}
.gal img:hover{transform:scale(1.025);filter:none}
.gal img:nth-child(odd){aspect-ratio:3/4}.gal img:nth-child(even){aspect-ratio:1/1}
.lb{position:fixed;inset:0;background:rgba(20,24,18,.94);display:none;align-items:center;justify-content:center;z-index:50;opacity:0;transition:opacity .3s}
.lb.open{display:flex;opacity:1}
.lb img{max-width:92vw;max-height:80vh;border-radius:10px;animation:pop .45s var(--ease)}
.lb button{position:absolute;background:none;border:0;color:#fff;font-size:34px;padding:12px;cursor:pointer}
.lb .x{top:10px;right:14px}.lb .p{left:6px}.lb .n{right:6px}

/* ===== Hadiah (selalu rata tengah) ===== */
.acc{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s var(--ease)}
.acc.open{grid-template-rows:1fr}
.acc>div{overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.acc.open>div{padding-top:20px}
.bank{width:100%;max-width:300px;background:var(--sand);border-radius:16px;padding:16px 18px;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:10px}
.bank b{display:block;font-size:1.02rem;letter-spacing:.04em;font-weight:500}
.bank small{display:block;font-size:.74rem;opacity:.8}
.bank .btn{min-height:36px;padding:6px 16px}
/* tema kartu rekening per bank (adaptif v2) */
/* hanya warna, motif & logo: ukuran, jarak, huruf & sudut mengikuti template */
.bank[data-bk]{color:var(--bt);background:var(--pt),linear-gradient(140deg,var(--b1),var(--b2));position:relative;overflow:hidden}
.bank[data-bk] b,.bank[data-bk] span,.bank[data-bk] small{color:var(--bt)}
.bank[data-bk] b.lgp{display:flex;align-items:center;width:fit-content;max-width:100%;background:#fff;border-radius:.3em;padding:0 .55em;height:1.6em;letter-spacing:0;margin-bottom:2px}
.bank b.lgp .lg{display:block;height:72%;width:auto;max-width:7.5em}
.bank[data-bk] .btn,.bank[data-bk] .btn.ghost{color:var(--bt)!important;border-color:var(--ba)!important;background:rgba(255,255,255,.16)}

/* ===== Form RSVP ===== */
form{display:flex;flex-direction:column;gap:12px;text-align:left;max-width:340px;margin:0 auto}
input,select,textarea{width:100%;padding:13px 16px;border:1px solid var(--line);border-radius:14px;background:#fff;font:300 .88rem Poppins,sans-serif;color:var(--ink);min-height:48px;transition:border-color .25s,box-shadow .25s}
input:focus,select:focus,textarea:focus{border-color:var(--sage);box-shadow:0 0 0 4px rgba(137,150,129,.18);outline:0}
textarea{min-height:104px;resize:vertical}
.hide{display:none!important}
.msg{background:#fff;color:var(--ink);border-radius:16px;padding:16px 18px;margin:12px auto 0;max-width:340px;text-align:left;border:1px solid var(--line)}
.msg b{font:500 1.15rem 'Cormorant Garamond',Georgia,serif}
.msg p{font-size:.86rem;margin:4px 0;overflow-wrap:anywhere;white-space:pre-line}
.msg small{font-size:.7rem;opacity:.6}
.ok{color:#4F7A55}.no{color:#A5594B}.rg{color:#8F7733}
#ucapan{margin-top:6px}

/* ===== Kontak & turut mengundang ===== */
.kt{display:flex;flex-direction:column;gap:10px;margin-top:14px;align-items:center}
.kt .k{width:100%;max-width:310px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left}
.kt .k b{display:block;font:500 1.1rem 'Cormorant Garamond',Georgia,serif}
.kt .k small{font-size:.74rem;opacity:.7}
.kt .btn{min-height:38px;padding:8px 16px}
.tm{margin-top:16px}
.tm p{font:500 1.15rem/1.4 'Cormorant Garamond',Georgia,serif;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.tm p:last-child{border-bottom:0;margin-bottom:0;padding-bottom:0}

/* ===== Penutup & toast ===== */
.closing img.ph{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:22px;margin:24px 0;filter:saturate(.9)}
.closing h3{color:var(--gold2)}
.toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 20px;border-radius:999px;font-size:.8rem;opacity:0;pointer-events:none;transition:.3s;z-index:60;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}

/* ===== Menu menggantung di bawah ===== */
.dock{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(398px,calc(100% - 24px));transform:translate(-50%,150%);display:flex;padding:6px;border-radius:24px;background:rgba(255,253,248,.84);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);border:1px solid rgba(197,164,109,.38);box-shadow:0 18px 40px -14px rgba(48,41,35,.45);z-index:30;opacity:0;transition:transform .8s var(--ease),opacity .5s}
.dock.show{transform:translate(-50%,0);opacity:1}
.dock .pill{position:absolute;top:6px;bottom:6px;left:0;width:0;border-radius:18px;background:rgba(137,150,129,.18);transition:transform .5s var(--ease),width .5s var(--ease);pointer-events:none}
.dock button{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 2px 8px;border:0;background:none;border-radius:18px;color:var(--mut);font:500 9.5px/1 Poppins,sans-serif;letter-spacing:.04em;cursor:pointer;transition:color .3s;-webkit-tap-highlight-color:transparent}
.dock button svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transition:transform .45s var(--ease)}
.dock button.on{color:var(--sage-d)}
.dock button.on svg{transform:translateY(-2px) scale(1.1)}
.dock button:active svg{transform:scale(.88)}
.music{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:max(14px,calc(50% - 201px));width:42px;height:42px;border-radius:50%;border:1px solid rgba(197,164,109,.5);background:rgba(255,253,248,.82);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:var(--sage-d);z-index:30;display:none;place-items:center;cursor:pointer;box-shadow:0 10px 24px -10px rgba(48,41,35,.5)}
.music svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.music.show{display:grid;animation:pop .6s var(--ease)}
.music.on svg{animation:spin 6s linear infinite}
.music:not(.on):after{content:"";position:absolute;width:24px;height:1.5px;background:var(--sage-d);transform:rotate(-45deg);border-radius:2px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}

/* ===== Sistem animasi: data-anim="fade-up|fade-down|fade-left|fade-right|zoom-in|blur-in|line" ===== */
.js [data-anim]{opacity:0;transition:opacity var(--d) var(--ease),transform var(--d) var(--ease),filter var(--d) var(--ease)}
.js [data-anim=fade-up]{transform:translateY(26px)}
.js [data-anim=fade-down]{transform:translateY(-26px)}
.js [data-anim=fade-left]{transform:translateX(-34px)}
.js [data-anim=fade-right]{transform:translateX(34px)}
.js [data-anim=zoom-in]{transform:scale(.93)}
.js [data-anim=blur-in]{filter:blur(8px)}
.js [data-anim].is-visible{opacity:1;transform:none;filter:none}
.no-anim [data-anim]{opacity:1!important;transform:none!important;filter:none!important;transition:none!important}
.no-anim .parts i,.no-anim #buka{animation:none!important}
.no-anim .slides img.on{transform:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.js [data-anim]{opacity:1;transform:none;filter:none}.js [data-anim=line]{width:44px}.slides img.on{transform:none}}

      var ac = {}, ada = false;
      Object.keys(AC_KEY).forEach(function (k) { if (typeof p[k] === 'string' && p[k].trim()) { ac[AC_KEY[k]] = p[k].trim(); ada = true; } });
      if (ada && ACARA.length) { S.ac = ac; jadwal(); }
    }).catch(function () { });
  }

  var fm = $('#rsvp');
  if (fm) {
    fm.hadir.addEventListener('change', function () { $('#jmlBox').classList.toggle('hide', fm.hadir.value !== 'hadir'); });
    fm.addEventListener('submit', function (ev) {
      ev.preventDefault();
      var n = fm.nama.value.trim(), u = fm.ucapan.value.trim(), hd = fm.hadir.value;
      if (!n || !u || !hd) { toast('Lengkapi semua kolom'); return; }
      var lt = 0;
      try { lt = +localStorage.getItem('rsvp_last') || 0; } catch (_) { }
      if (Date.now() - lt < JEDA_KIRIM) { toast('Mohon tunggu sebentar sebelum mengirim lagi'); return; }
      var item = { nama: n.slice(0, 40), isi: u.slice(0, 300), hadir: hd };
      if (hd === 'hadir') item.jumlah = Math.max(1, Math.min(20, +fm.jumlah.value || 1));
      var btn = fm.querySelector('button[type=submit]');
      var selesai = function () {
        try { localStorage.setItem('rsvp_last', String(Date.now())); } catch (_) { }
        fm.reset(); $('#jmlBox').classList.add('hide'); toast('Jazakumullahu khairan atas doa dan konfirmasinya'); muat();
      };
      if (!FB.aktif) { item.waktu = new Date(); simpanLokal(item); selesai(); return; }
      btn.disabled = true;
      FB.kirimUcapan(item).then(selesai)
        .catch(function () { toast('Gagal mengirim. Periksa koneksi lalu coba lagi.'); })
        .then(function () { btn.disabled = false; });
    });
    var wa = $('#kirimWA');
    if (wa) wa.addEventListener('click', function () {
      var n = fm.nama.value.trim();
      if (!n || !fm.hadir.value) { toast('Isi nama dan kehadiran dulu'); return; }
      var st2 = { hadir: 'Hadir' + (fm.hadir.value === 'hadir' && +fm.jumlah.value > 1 ? ' (' + fm.jumlah.value + ' orang)' : ''), tidak: 'Tidak Hadir', ragu: 'Masih Ragu' }[fm.hadir.value];
      var t = 'Assalamu\'alaikum. Saya ' + n + ' (' + st2 + ') untuk acara khitan ' + PANG + '. ' + fm.ucapan.value.trim();
      window.open('https://wa.me/' + String(D.pemesan.whatsapp).replace(/\D/g, '') + '?text=' + encodeURIComponent(t), '_blank', 'noopener');
    });
  }

  /* ---------- Mulai ---------- */
  var sembunyiAwal = ['s-hadiah', 'turut', 's-galeri', 's-doa', 's-kontak'];
  if (FB.aktif) {
    sembunyiAwal.forEach(function (id) { var el = $('#' + id); if (el) el.style.display = 'none'; });
    setTimeout(terapkan, 5000);
  } else terapkan();
  muatPengaturan().then(function () { terapkan(); muat(); });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) muatPengaturan().then(terapkan); });
})();
</script>
</body>
</html>
